# Cloudflare Worker config for AH Estimating's Gemini classifier proxy.
#
# IMPORTANT: `name` MUST stay "ah-estimating-classifier" — that matches the
# existing deployed Worker. Changing it would cause Cloudflare to create a
# duplicate Worker on next deploy and the PWA's CONFIG.classifierUrl would
# stop resolving.
#
# SECRETS (never in this file — set via `wrangler secret put` / dashboard):
#   - GEMINI_API_KEY   -> Gemini API key
#   - VANTA_APP_TOKEN  -> Vanta app token (fetchRecipe scope) for the Mode-B
#                         method runner. When unset, runMethod falls back to the
#                         bundled fixtures (offline). Stored locally at
#                         ~/.claude/secrets/ah-est-vanta-app-token.txt.
#
# Non-secret runtime variables ARE code-managed below in [vars] (was: dashboard
# Text vars). On deploy, [vars] is authoritative — keep CORS_ORIGINS complete.
#
# `compatibility_date` is the snapshot of the Workers runtime to use. Pin
# rather than auto-rolling so a Cloudflare runtime change can never silently
# break this Worker. Bump deliberately if/when needed.

name = "ah-estimating-classifier"
main = "worker.js"
compatibility_date = "2025-09-01"

[vars]
# Vanta base URL (Tailscale Funnel, public HTTPS). The Worker fetches method
# recipes from here with the VANTA_APP_TOKEN secret.
VANTA_BASE = "https://kaa-nuc.tailc0993f.ts.net"
# Origins allowed to call this Worker. Live PWA is on pages.dev; github.io is
# the backup host. Add localhost origins here if testing the runner locally.
CORS_ORIGINS = "https://ah-estimating.pages.dev,https://oskar617-cmyk.github.io"
